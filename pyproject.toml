[project]
name = "dante-dravidian"
version = "0.1.0"
description = "Translate Dante's Divine Comedy into Dravidian languages using LLM-powered 5-stage structured translation"
readme = "README.md"
license = { text = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication" }
repository = "https://github.com/7shi/dante-dravidian"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "dante-corpus",
    "llm7shi",
    "pydub>=0.25.1",
]

[tool.uv.sources]
llm7shi = { git = "https://github.com/7shi/llm7shi.git" }
dante-corpus = { path = "../dante-corpus", editable = true }
